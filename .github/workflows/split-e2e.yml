# ============================================================================
# NURAE — Split-deployment E2E (REAL services, no mocks)
# ============================================================================
#
# Proves the split architecture end to end with real everything:
#
#   [Vercel frontend (stable URL)]  ← real dashboard, gateway mode
#         │   /api/* runtime middleware proxy → the LINKED backend
#         ▼
#   [trycloudflare tunnel]  ← the only public entry to a GitHub runner
#         ▼
#   [GitHub Actions runner]
#     ├─ real backend (Next.js standalone, fresh SQLite, admin auth ON)
#     ├─ real api.telegram.org   (webhook registered to the tunnel URL)
#     └─ real AI provider API    (real key, encrypted at rest in the DB)
#
# Gateway Link: on boot the backend registers its tunnel origin with the
# frontend (POST /api/gateway/register, shared NURAE_GATEWAY_KEY) and
# refreshes it every 60 s — the frontend is deployed ONCE and is never
# rebuilt per run. The E2E driver then exercises:
#
#   Telegram → webhook → tunnel → backend → AI provider → Telegram reply
#
# (a HUMAN sends the one message — Telegram does not allow bots to message
# first, and bots cannot message bots)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN   Real bot token from @BotFather. Use a DEDICATED test
#                        bot: this workflow registers a webhook on it and
#                        removes it at the end (it overwrites any existing
#                        webhook on that bot).
#   AI_API_KEY           Real key for the chosen provider (openai / openrouter
#                        / deepseek / glm / custom).
#   GATEWAY_KEY          Optional. When unset the backend falls back to the
#                        TEMPORARY bootstrap key hardcoded below (beta-03) —
#                        PUBLIC in this repo, rotate/delete after the check.
#                        It must equal NURAE_GATEWAY_KEY on the Vercel
#                        deployment (which currently falls back to the same
#                        bootstrap key via src/lib/gateway/bootstrap-key.ts).
#
# One-time Vercel setup for frontend=gateway (see README §14):
#   1. Deploy NURAE to Vercel once (any commit of beta-03+).
#   2. Project → Storage → create a Blob store (the link is stored there).
#   3. (Temporary, beta-03) Nothing else — a bootstrap gateway key is
#      hardcoded and auto-active on Vercel. For production set the real
#      NURAE_GATEWAY_KEY env var; it always wins over the fallback.
#   4. Note the production URL (default https://<project>.vercel.app).
#
# Run it from the Actions tab → this workflow → Run workflow. Watch the log
# for "👉 NOW: send ANY text message to @your_test_bot", send it from any
# Telegram account, and the workflow verifies the rest on its own.
#
# To also run on every push to main, uncomment the push trigger below.

name: Split E2E (Vercel frontend × Actions backend)

on:
  workflow_dispatch:
    inputs:
      frontend:
        description: 'Frontend under test (gateway = stable Vercel deployment with Gateway Link; tunnel-only skips the frontend)'
        type: choice
        default: gateway
        options:
          - gateway
          - tunnel-only
      frontend_url:
        description: 'Frontend origin for gateway mode (your Vercel production URL)'
        type: string
        default: 'https://nurae.vercel.app'
      ai_provider:
        description: 'Real AI provider (id from the NURAE catalog)'
        type: choice
        default: openai
        options:
          - openai
          - openrouter
          - deepseek
          - glm
          - custom
      ai_model:
        description: 'Real model name (e.g. gpt-4o-mini)'
        type: string
        default: gpt-4o-mini
      message_wait_seconds:
        description: 'Seconds to wait for your real Telegram message'
        type: string
        default: '300'

  # push:
  #   branches: [main]

concurrency:
  group: split-e2e
  cancel-in-progress: true

jobs:
  split-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FRONTEND_MODE: ${{ inputs.frontend || 'gateway' }}
      FRONTEND_URL: ${{ inputs.frontend_url || 'https://nurae.vercel.app' }}
      AI_PROVIDER: ${{ inputs.ai_provider || 'openai' }}
      AI_MODEL: ${{ inputs.ai_model || 'gpt-4o-mini' }}
      MESSAGE_WAIT: ${{ inputs.message_wait_seconds || '300' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
    steps:
      - name: Preflight — fail fast with setup instructions
        run: |
          missing=0
          for s in TELEGRAM_BOT_TOKEN AI_API_KEY; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret: $s"; missing=1; fi
          done
          if [ "$FRONTEND_MODE" = "gateway" ]; then
            if [ -z "$GATEWAY_KEY" ]; then
              echo "NOTE: GATEWAY_KEY secret not set — using the TEMPORARY bootstrap key hardcoded for beta-03 (public in this repo; rotate after the check)."
            fi
          fi
          if [ "$missing" = "1" ]; then
            echo "Required secrets:"
            echo "  TELEGRAM_BOT_TOKEN  — real token from @BotFather (use a dedicated test bot)"
            echo "  AI_API_KEY          — real key for provider '$AI_PROVIDER'"
            echo "  GATEWAY_KEY         — gateway mode only; must equal NURAE_GATEWAY_KEY on Vercel"
            echo "Tip: run with frontend=tunnel-only to test the backend without a frontend."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies + database schema
        run: |
          npm ci --no-audit --no-fund
          export DATABASE_URL="file:$PWD/db/e2e.db"
          npm run db:generate
          npm run db:push

      - name: Build backend (Next.js standalone)
        run: |
          export DATABASE_URL="file:$PWD/db/e2e.db"
          npm run build

      - name: Start public tunnel (cloudflared quick tunnel)
        run: |
          curl -sSLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3000 --no-autoupdate --protocol http2 > tunnel.log 2>&1 &
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then
              echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
              echo "Tunnel ready: $URL"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Tunnel did not produce a URL in 90s"
          cat tunnel.log
          exit 1

      - name: Start backend (registers itself with the frontend in gateway mode)
        run: |
          ADMIN_TOKEN=$(openssl rand -hex 24)
          SECRET_KEY=$(openssl rand -hex 32)
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          GATEWAY_ENV=""
          if [ "$FRONTEND_MODE" = "gateway" ]; then
            # TEMPORARY bootstrap key (beta-03) — must equal the frontend fallback in src/lib/gateway/bootstrap-key.ts. Rotate both together.
            GATEWAY_ENV="NURAE_LINK_FRONTEND_URL=$FRONTEND_URL NURAE_GATEWAY_KEY=${GATEWAY_KEY:-nurae-f&bc_0U24KN802q0CATd8f9YwX1Pde8aj}"
          fi
          env \
            DATABASE_URL="file:$PWD/db/e2e.db" \
            NURAE_SECRET_KEY="$SECRET_KEY" \
            NURAE_ADMIN_TOKEN="$ADMIN_TOKEN" \
            NURAE_PUBLIC_BASE_URL="$TUNNEL_URL" \
            $GATEWAY_ENV \
            node .next/standalone/server.js > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Backend healthy on :3000 (public via $TUNNEL_URL)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy"
          cat backend.log
          exit 1

      - name: Smoke test through the tunnel (health via public HTTPS)
        run: |
          for i in $(seq 1 15); do
            if curl -sf "$TUNNEL_URL/api/health" > tunnel-health.json; then
              echo "Tunnel → backend OK:"; cat tunnel-health.json; echo
              exit 0
            fi
            sleep 3
          done
          echo "::error::Tunnel smoke test failed"
          tail -40 tunnel.log
          exit 1

      - name: Verify the frontend deployment is in gateway mode
        if: env.FRONTEND_MODE == 'gateway'
        run: |
          for i in $(seq 1 10); do
            BODY=$(curl -sf "$FRONTEND_URL/api/gateway/status" || true)
            if [ -n "$BODY" ]; then
              echo "Frontend gateway status: $BODY"
              MODE=$(echo "$BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).gatewayMode)}catch{console.log("parse-error")}})')
              if [ "$MODE" = "true" ]; then exit 0; fi
              echo "::error::Frontend at $FRONTEND_URL is NOT in gateway mode (gatewayMode=$MODE)."
              echo "One-time setup: set NURAE_GATEWAY_KEY env on the Vercel project + connect a Blob store, then redeploy. See README §14."
              exit 1
            fi
            sleep 6
          done
          echo "::error::$FRONTEND_URL never answered /api/gateway/status — is the NURAE frontend deployed there?"
          exit 1

      - name: Wait for the backend to link itself with the frontend
        if: env.FRONTEND_MODE == 'gateway'
        run: |
          TUNNEL_HOST="${TUNNEL_URL#https://}"
          for i in $(seq 1 30); do
            BODY=$(curl -sf "$FRONTEND_URL/api/gateway/status" || true)
            LINKED=$(echo "$BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).linked)}catch{console.log("parse-error")}})' || true)
            HOST=$(echo "$BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).endpoint)}catch{console.log("")}}' || true)
            if [ "$LINKED" = "true" ] && [ "$HOST" = "$TUNNEL_HOST" ]; then
              echo "Gateway link established: $FRONTEND_URL → $TUNNEL_URL"
              exit 0
            fi
            echo "waiting for link… (linked=${LINKED:-unknown}, endpoint=${HOST:-none}, want $TUNNEL_HOST)"
            sleep 4
          done
          echo "::error::Backend never linked with the frontend. Check GATEWAY_KEY matches NURAE_GATEWAY_KEY."
          grep -a GATEWAY backend.log | tail -10 || true
          exit 1

      - name: Run split E2E (real Telegram + real AI; YOU send one message when prompted)
        run: npx --yes tsx scripts/e2e.ts
        env:
          E2E_BASE_URL: ${{ env.FRONTEND_MODE == 'gateway' && env.FRONTEND_URL || env.TUNNEL_URL }}
          E2E_WEBHOOK_BASE: ${{ env.TUNNEL_URL }}
          E2E_ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
          E2E_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          E2E_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          E2E_PROVIDER: ${{ env.AI_PROVIDER }}
          E2E_MODEL: ${{ env.AI_MODEL }}
          E2E_MESSAGE_WAIT_SECONDS: ${{ env.MESSAGE_WAIT }}
          E2E_GATEWAY_LINK: ${{ env.FRONTEND_MODE == 'gateway' && '1' || '0' }}

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-e2e-logs
          if-no-files-found: ignore
          path: |
            backend.log
            tunnel.log
            tunnel-health.json
